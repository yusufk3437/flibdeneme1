<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mood Run</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0f172a;
            font-family: 'Fredoka', sans-serif; color: white;
            user-select: none; touch-action: none;
        }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Screens */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(15, 23, 42, 0.9); z-index: 10; display: none;
            text-align: center;
        }
        .screen.active { display: flex; }
        
        /* Buttons */
        button {
            background: #22c55e; color: white; border: none;
            padding: 15px 30px; font-size: 1.2rem; border-radius: 12px;
            margin: 10px; cursor: pointer; font-family: 'Fredoka', sans-serif;
            box-shadow: 0 6px 0 #166534; transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }
        button:active { transform: translateY(6px); box-shadow: 0 0px 0 #166534; }
        .btn-blue { background: #3b82f6; box-shadow: 0 6px 0 #1e3a8a; }
        .btn-blue:active { box-shadow: 0 0px 0 #1e3a8a; }
        .btn-red { background: #ef4444; box-shadow: 0 6px 0 #7f1d1d; }
        .btn-red:active { box-shadow: 0 0px 0 #7f1d1d; }

        /* Header */
        .header { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 20; }
        .currency { display: flex; gap: 15px; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; font-size: 1.2rem; align-items: center; }
        .icon { width: 20px; height: 20px; border-radius: 50%; display: inline-block; }
        .icon-gold { background: radial-gradient(circle, #fde047, #eab308); }
        .icon-diamond { background: radial-gradient(circle, #67e8f9, #06b6d4); clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); border-radius: 0; width: 24px; height: 24px;}

        /* In-Game UI */
        #memory-board {
            position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 15px 30px; border-radius: 15px;
            font-size: 2.5rem; display: flex; gap: 20px; display: none; z-index: 5;
        }
        #start-tap-text {
            position: absolute; bottom: 20%; width: 100%; text-align: center;
            font-size: 2rem; font-weight: bold; text-shadow: 2px 2px 4px #000;
            animation: pulse 1.5s infinite; display: none; z-index: 5;
        }
        @keyframes pulse { 0% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.3; transform: scale(1); } }

        /* Multiplayer Specific */
        #mp-info { position: absolute; top: 80px; width: 100%; text-align: center; font-size: 1.2rem; color: #fbbf24; z-index: 20; display: none;}
        .player-name { position: absolute; top: -30px; transform: translateX(-50%); font-size: 1.2rem; font-weight: bold; text-shadow: 1px 1px 2px #000; white-space: nowrap;}
        .player-arrow { position: absolute; top: -50px; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 15px solid red; }

        /* Loser Screen Specific */
        #loser-face { font-size: 5rem; margin-bottom: 10px; }
        #loser-title { color: #ef4444; font-size: 3rem; margin: 0; }
    </style>
    
    <!-- Import Maps for Three.js and PeerJS -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "peerjs": "https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"
            }
        }
    </script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="screen-loading" class="screen active">
        <h1 style="color:#3b82f6; font-size: 3rem; margin-bottom: 20px;">MOOD RUN</h1>
        <div style="width: 50px; height: 50px; border: 5px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>
    </div>

    <!-- Terms Screen -->
    <div id="screen-terms" class="screen">
        <div style="background: #1e293b; padding: 30px; border-radius: 20px; max-width: 80%;">
            <h2>WELCOME</h2>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 20px;">Please accept the Terms of Service and Privacy Policy to play.</p>
            <button id="btn-accept">ACCEPT</button>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="screen-menu" class="screen">
        <h1 style="font-size: 4rem; margin-bottom: 40px; text-shadow: 0 5px 0 #1e3a8a;">MOOD RUN</h1>
        <button id="btn-solo" class="btn-blue" style="width: 250px;">INFINITE MODE</button>
        <button id="btn-host" class="btn-blue" style="width: 250px;">HOST MULTIPLAYER</button>
        <button id="btn-join" class="btn-blue" style="width: 250px;">JOIN MULTIPLAYER</button>
        
        <!-- Join Input Area -->
        <div id="join-area" style="display: none; margin-top: 20px;">
            <input type="text" id="room-code-input" placeholder="Enter Room Code" style="padding: 10px; font-size: 1.2rem; border-radius: 10px; text-align: center;">
            <button id="btn-connect" class="btn-blue" style="margin-top: 10px;">CONNECT</button>
        </div>
    </div>

    <!-- Game UI -->
    <div id="game-ui" class="screen active" style="display: none; background: transparent; pointer-events: none;">
        <div class="header" style="pointer-events: auto;">
            <div class="currency">
                <span class="icon icon-gold"></span> <span id="ui-gold">0</span>
                <span class="icon icon-diamond"></span> <span id="ui-diamond">0</span>
            </div>
        </div>
        <div id="mp-info"></div>
        <div id="memory-board"></div>
        <div id="start-tap-text">TAP AND MOVE</div>
    </div>

    <!-- Game Over / Loser Screen -->
    <div id="screen-gameover" class="screen">
        <div id="loser-face">:(</div>
        <h2 id="loser-title">OOPS!</h2>
        <p id="loser-desc" style="font-size: 1.2rem; color: #cbd5e1;">YOU MADE A MISTAKE!</p>
        
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <button id="btn-revive" class="btn-blue" style="display: none; background:#eab308; box-shadow: 0 6px 0 #854d0e;">[TEST AD] REVIVE</button>
            <button id="btn-menu" class="btn-red">MENU</button>
        </div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="game-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import Peer from 'peerjs';

        // --- CONFIG & STATE ---
        const FACES = ['HAPPY', 'SAD', 'NEUTRAL'];
        const COLORS = { HAPPY: '#fbbf24', SAD: '#3b82f6', NEUTRAL: '#94a3b8' };
        const GATE_COLORS = [0xef4444, 0x22c55e, 0x8b5cf6, 0xf97316]; // Colors independent of faces
        const LANE_WIDTH = 5.5;
        const ROPE_MAX_DIST = 2.0;

        let state = 'LOADING';
        let scene, camera, renderer, clock;
        let player1, player2, ropeLine;
        let gates = [];
        let memorySequence = [];
        let currentStep = 0;
        let isRunning = false;
        let speed = 15;
        let distance = 0;
        let lives = 3;
        
        // Multiplayer Variables
        let peer = null;
        let conn = null;
        let isHost = false;
        let myPlayerId = Math.floor(Math.random() * 1000);
        let otherPlayerId = 0;
        let isOtherPlayerDead = false;

        // UI Elements
        const ui = {
            loading: document.getElementById('screen-loading'),
            terms: document.getElementById('screen-terms'),
            menu: document.getElementById('screen-menu'),
            game: document.getElementById('game-ui'),
            gameover: document.getElementById('screen-gameover'),
            memoryBoard: document.getElementById('memory-board'),
            startTap: document.getElementById('start-tap-text'),
            mpInfo: document.getElementById('mp-info'),
            gold: document.getElementById('ui-gold'),
            diamond: document.getElementById('ui-diamond'),
            joinArea: document.getElementById('join-area'),
            roomInput: document.getElementById('room-code-input')
        };

        // --- INITIALIZATION ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 10);
            camera.lookAt(0, 2, -10);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            clock = new THREE.Clock();

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(50, 1000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.z = -500;
            floor.receiveShadow = true;
            scene.add(floor);

            // Create Players
            player1 = new Player(scene, new THREE.Vector3(0, 0, 0), 0x3b82f6, "P1");
            
            // Resize handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Check terms
            if (localStorage.getItem('termsAccepted')) {
                showScreen('menu');
            } else {
                showScreen('terms');
            }

            setupInput();
            setupUI();
            setupMultiplayerUI();

            state = 'MENU';
            animate();
        }

        // --- PLAYER CLASS ---
        class Player {
            constructor(scene, pos, color, name) {
                this.mesh = new THREE.Group();
                this.mesh.position.copy(pos);
                scene.add(this.mesh);
                this.name = name;
                this.targetX = pos.x;
                this.color = color;
                this.isDead = false;

                // Body (Capsule for smoothness)
                const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
                const limbMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

                const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.5, 1.2, 16, 16), bodyMat);
                torso.position.y = 1.2; torso.castShadow = true;
                this.mesh.add(torso);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), bodyMat);
                head.position.y = 2.4; head.castShadow = true;
                this.mesh.add(head);

                // Limbs
                const armGeo = new THREE.CapsuleGeometry(0.15, 0.8, 8, 8);
                this.leftArm = new THREE.Mesh(armGeo, limbMat);
                this.leftArm.position.set(-0.65, 1.6, 0); this.leftArm.castShadow = true;
                this.mesh.add(this.leftArm);

                this.rightArm = new THREE.Mesh(armGeo, limbMat);
                this.rightArm.position.set(0.65, 1.6, 0); this.rightArm.castShadow = true;
                this.mesh.add(this.rightArm);

                const legGeo = new THREE.CapsuleGeometry(0.2, 0.7, 8, 8);
                this.leftLeg = new THREE.Mesh(legGeo, limbMat);
                this.leftLeg.position.set(-0.25, 0.4, 0); this.leftLeg.castShadow = true;
                this.mesh.add(this.leftLeg);

                this.rightLeg = new THREE.Mesh(legGeo, limbMat);
                this.rightLeg.position.set(0.25, 0.4, 0); this.rightLeg.castShadow = true;
                this.mesh.add(this.rightLeg);

                // Name Tag
                this.nameTag = document.createElement('div');
                this.nameTag.className = 'player-name';
                this.nameTag.innerText = name;
                this.nameTag.style.color = '#' + color.toString(16).padStart(6, '0');
                document.body.appendChild(this.nameTag);

                this.arrow = document.createElement('div');
                this.arrow.className = 'player-arrow';
                this.arrow.style.borderTopColor = '#' + color.toString(16).padStart(6, '0');
                document.body.appendChild(this.arrow);

                this.animTime = Math.random() * 10;
            }

            move(deltaX) {
                if (this.isDead) return;
                this.targetX = THREE.MathUtils.clamp(this.targetX + deltaX, -LANE_WIDTH/2, LANE_WIDTH/2);
            }

            update(delta, forwardSpeed) {
                if (this.isDead) return;
                
                // Forward movement
                this.mesh.position.z -= forwardSpeed * delta;
                
                // Lateral movement
                this.mesh.position.x = THREE.MathUtils.lerp(this.mesh.position.x, this.targetX, 0.2);

                // Animation
                this.animTime += delta * 15;
                const swing = Math.sin(this.animTime) * 0.6;
                
                this.leftArm.rotation.x = swing;
                this.rightArm.rotation.x = -swing;
                this.leftLeg.rotation.x = -swing;
                this.rightLeg.rotation.x = swing;
                
                this.mesh.rotation.x = 0.1; // Lean forward
                const bounce = Math.abs(Math.sin(this.animTime)) * 0.1;
                this.mesh.position.y = bounce;

                // Update UI position
                this.updateUIProjection();
            }

            updateUIProjection() {
                if (this.isDead) {
                    this.nameTag.style.display = 'none';
                    this.arrow.style.display = 'none';
                    return;
                }
                this.nameTag.style.display = 'block';
                this.arrow.style.display = 'block';

                const vector = new THREE.Vector3(this.mesh.position.x, this.mesh.position.y + 3.5, this.mesh.position.z);
                vector.project(camera);

                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(vector.y * 0.5) + 0.5) * window.innerHeight;

                this.nameTag.style.left = `${x}px`;
                this.nameTag.style.top = `${y}px`;
                
                this.arrow.style.left = `${x}px`;
                this.arrow.style.top = `${y - 20}px`;
            }

            die() {
                this.isDead = true;
                this.mesh.rotation.x = -Math.PI / 2;
                this.mesh.position.y = 0.5;
            }
        }

        // --- GATES & MEMORY ---
        function createTextTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 256, 256);
            
            // Draw Face
            ctx.fillStyle = '#ffffff';
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#ffffff';
            
            if (text === 'HAPPY') {
                ctx.beginPath(); ctx.arc(80, 100, 15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(176, 100, 15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(128, 120, 60, 0.1, Math.PI - 0.1); ctx.stroke();
            } else if (text === 'SAD') {
                ctx.beginPath(); ctx.arc(80, 100, 15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(176, 100, 15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(128, 200, 60, Math.PI + 0.1, -0.1); ctx.stroke();
            } else { // NEUTRAL
                ctx.beginPath(); ctx.arc(80, 100, 15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(176, 100, 15, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(80, 160); ctx.lineTo(176, 160); ctx.stroke();
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function spawnGateRow(zPos, correctFace) {
            const faces = [...FACES].sort(() => Math.random() - 0.5);
            const spacing = LANE_WIDTH / 2;
            
            for (let i = 0; i < 3; i++) {
                const face = faces[i];
                const colorHex = GATE_COLORS[Math.floor(Math.random() * GATE_COLORS.length)];
                const colorStr = '#' + colorHex.toString(16).padStart(6, '0');
                
                const texture = createTextTexture(face, colorStr);
                const mat = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide });
                const geo = new THREE.PlaneGeometry(spacing - 0.2, 3);
                const gate = new THREE.Mesh(geo, mat);
                
                gate.position.set((i - 1) * spacing, 1.5, zPos);
                gate.userData = { face: face, checked: false };
                scene.add(gate);
                gates.push(gate);
            }
        }

        function setupMemory() {
            memorySequence = [];
            for (let i = 0; i < 3; i++) {
                memorySequence.push(FACES[Math.floor(Math.random() * FACES.length)]);
            }
            
            ui.memoryBoard.style.display = 'flex';
            ui.memoryBoard.innerHTML = '';
            memorySequence.forEach((face, idx) => {
                const span = document.createElement('span');
                span.innerText = face === 'HAPPY' ? '😊' : (face === 'SAD' ? '😢' : '😐');
                ui.memoryBoard.appendChild(span);
            });

            // Spawn 3 rows of gates
            const startZ = -30;
            for (let i = 0; i < 3; i++) {
                spawnGateRow(startZ - (i * 20), memorySequence[i]);
            }

            setTimeout(() => {
                ui.memoryBoard.style.display = 'none';
            }, 3000);
        }

        // --- GAME LOOP & LOGIC ---
        function startGame(isMultiplayer = false) {
            // Reset everything
            scene.children.forEach(child => {
                if (child.type === 'Mesh' && child.geometry.type === 'PlaneGeometry' && child.userData.face) {
                    scene.remove(child);
                }
            });
            gates = [];
            distance = 0;
            currentStep = 0;
            lives = 3;
            isRunning = false;
            
            player1.isDead = false;
            player1.mesh.position.set(-1, 0, 0);
            player1.targetX = -1;
            player1.mesh.rotation.set(0,0,0);
            
            if (isMultiplayer) {
                player2.isDead = false;
                player2.mesh.position.set(1, 0, 0);
                player2.targetX = 1;
                player2.mesh.rotation.set(0,0,0);
                isOtherPlayerDead = false;
            }

            setupMemory();
            
            showScreen('game');
            ui.startTap.style.display = 'block';
            state = 'PLAYING';
        }

        function handleGateCollision(player, gate) {
            if (gate.userData.checked) return;
            
            // Collision box check
            if (player.mesh.position.z <= gate.position.z + 0.5 && player.mesh.position.z >= gate.position.z - 1) {
                const distanceX = Math.abs(player.mesh.position.x - gate.position.x);
                if (distanceX < 1.5) {
                    gate.userData.checked = true;
                    
                    const expectedFace = memorySequence[currentStep];
                    if (gate.userData.face === expectedFace) {
                        // Correct
                        currentStep++;
                        if (isHost || !conn) {
                            // Add score/coins
                        }
                    } else {
                        // Wrong
                        playerDie(player);
                    }
                }
            }
        }

        function playerDie(deadPlayer) {
            if (deadPlayer.isDead) return;
            deadPlayer.die();
            
            if (conn) {
                // Multiplayer Death
                if (deadPlayer === player1) {
                    conn.send({ type: 'game_over', loserName: "P1" });
                    showGameOver("P1 MADE A MISTAKE!");
                }
            } else {
                // Single Player Death
                lives--;
                if (lives > 0) {
                    // Revive logic
                    document.getElementById('btn-revive').style.display = 'block';
                    showGameOver("OOPS! You lost a life.", true);
                } else {
                    showGameOver("OUT OF LIVES!");
                }
            }
        }

        function showGameOver(message, canRevive = false) {
            state = 'GAMEOVER';
            isRunning = false;
            ui.gameover.classList.add('active');
            document.getElementById('loser-desc').innerText = message;
            document.getElementById('loser-face').innerText = "💀";
            document.getElementById('loser-title').innerText = "LOSER";
            document.getElementById('loser-title').style.color = "#ef4444";
            
            document.getElementById('btn-revive').style.display = canRevive ? 'block' : 'none';
        }

        // --- MULTIPLAYER (PEERJS) ---
        function setupMultiplayerUI() {
            document.getElementById('btn-host').addEventListener('click', () => {
                peer = new Peer();
                peer.on('open', (id) => {
                    ui.mpInfo.style.display = 'block';
                    ui.mpInfo.innerHTML = `ROOM CODE: ${id}<br>Waiting for player...`;
                    showScreen('game');
                    state = 'PLAYING';
                    ui.startTap.style.display = 'block';
                    ui.startTap.innerText = "WAITING FOR PLAYER...";
                    isHost = true;
                    
                    // Setup dummy player 2
                    player2 = new Player(scene, new THREE.Vector3(1, 0, 0), 0xef4444, "P2");
                });
                peer.on('connection', (connection) => {
                    conn = connection;
                    setupConnection();
                });
            });

            document.getElementById('btn-join').addEventListener('click', () => {
                ui.joinArea.style.display = 'block';
            });

            document.getElementById('btn-connect').addEventListener('click', () => {
                const hostId = ui.roomInput.value;
                if (!hostId) return;
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(hostId);
                    setupConnection();
                    isHost = false;
                    
                    // Setup dummy player 2 (Host)
                    player2 = new Player(scene, new THREE.Vector3(-1, 0, 0), 0x3b82f6, "P1(Host)");
                    player1.mesh.position.set(1, 0, 0);
                    player1.targetX = 1;
                });
            });

            function setupConnection() {
                conn.on('open', () => {
                    showScreen('game');
                    state = 'PLAYING';
                    ui.mpInfo.style.display = 'block';
                    ui.mpInfo.innerHTML = "CONNECTED!";
                    
                    // Create Rope
                    const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
                    const material = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 });
                    ropeLine = new THREE.Line(geometry, material);
                    scene.add(ropeLine);

                    setupMemory();
                    ui.startTap.style.display = 'block';
                    ui.startTap.innerText = "TAP TO START";
                });

                conn.on('data', (data) => {
                    if (data.type === 'move') {
                        if (!isHost) player1.targetX = data.x; // Guest moves Host
                        else player2.targetX = data.x; // Host moves Guest
                    }
                    if (data.type === 'start') {
                        isRunning = true;
                        ui.startTap.style.display = 'none';
                    }
                    if (data.type === 'game_over') {
                        isOtherPlayerDead = true;
                        showGameOver(data.loserName + " MADE A MISTAKE!");
                    }
                });
            }
        }

        // --- INPUT ---
        function setupInput() {
            let touchStartX = 0;
            
            window.addEventListener('pointerdown', (e) => {
                if (state === 'PLAYING' && !isRunning) {
                    isRunning = true;
                    ui.startTap.style.display = 'none';
                    if (conn) conn.send({ type: 'start' });
                }
                touchStartX = e.clientX;
            });

            window.addEventListener('pointermove', (e) => {
                if (state === 'PLAYING' && isRunning) {
                    const deltaX = (e.clientX - touchStartX) * 0.015;
                    touchStartX = e.clientX;
                    
                    player1.move(deltaX);
                    
                    // Sync X position
                    if (conn && conn.open) {
                        conn.send({ type: 'move', x: player1.targetX });
                    }
                }
            });
        }

        function setupUI() {
            document.getElementById('btn-accept').addEventListener('click', () => {
                localStorage.setItem('termsAccepted', 'true');
                showScreen('menu');
            });
            document.getElementById('btn-solo').addEventListener('click', () => {
                startGame(false);
            });
            document.getElementById('btn-menu').addEventListener('click', () => {
                if (conn) conn.close();
                if (peer) peer.destroy();
                location.reload();
            });
            document.getElementById('btn-revive').addEventListener('click', () => {
                document.getElementById('btn-revive').style.display = 'none';
                document.getElementById('screen-gameover').classList.remove('active');
                player1.isDead = false;
                player1.mesh.rotation.set(0,0,0);
                player1.mesh.position.y = 0;
                state = 'PLAYING';
                isRunning = true;
            });
        }

        function showScreen(screenName) {
            Object.values(ui).forEach(el => {
                if (el.classList && el.classList.contains('screen')) el.classList.remove('active');
            });
            if (ui[screenName]) ui[screenName].classList.add('active');
        }

        // --- ANIMATE ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent jumps

            if (state === 'PLAYING' && isRunning) {
                const currentSpeed = 15;
                
                // Player 1 Update
                player1.update(delta, currentSpeed);
                
                // Player 2 Update (Multiplayer)
                if (player2) {
                    // In MP, both move forward together. Sync Z.
                    if (conn) {
                        player2.mesh.position.z = player1.mesh.position.z;
                        // Host authoritative forward movement
                        if (!isHost) player1.mesh.position.z = player2.mesh.position.z; 
                    } else {
                        player2.update(delta, currentSpeed);
                    }
                    
                    // Rope Logic
                    if (ropeLine) {
                        const p1Pos = player1.mesh.position.clone();
                        p1Pos.y += 1.5;
                        const p2Pos = player2.mesh.position.clone();
                        p2Pos.y += 1.5;

                        const dist = p1Pos.distanceTo(p2Pos);
                        if (dist > ROPE_MAX_DIST) {
                            // Pull back
                            const dir = new THREE.Vector3().subVectors(p2Pos, p1Pos).normalize();
                            const overlap = dist - ROPE_MAX_DIST;
                            player1.targetX += dir.x * overlap * 0.5;
                            player2.targetX -= dir.x * overlap * 0.5;
                        }
                        
                        ropeLine.geometry.setFromPoints([p1Pos, p2Pos]);
                    }
                }

                // Camera Follow
                camera.position.z = player1.mesh.position.z + 12;
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, player1.mesh.position.x * 0.5, 0.1);
                camera.lookAt(player1.mesh.position.x * 0.5, 2, player1.mesh.position.z - 10);

                // Gate Collisions
                gates.forEach(gate => {
                    handleGateCollision(player1, gate);
                });

                // Distance & Sun Cycle
                distance += currentSpeed * delta;
                // Simple day/night cycle
                const cycle = (Math.sin(distance * 0.005) + 1) / 2; // 0 to 1
                const skyColor = new THREE.Color().lerpColors(new THREE.Color(0x0f172a), new THREE.Color(0x87CEEB), cycle);
                scene.background = skyColor;
                scene.fog.color = skyColor;
            }

            // Update UI Tags even if not running
            player1.updateUIProjection();
            if (player2) player2.updateUIProjection();

            renderer.render(scene, camera);
        }

        // Start
        init();

    </script>
</body>
