    const CACHE='flib-v2-cache';
    self.addEventListener('install',e=>{self.skipWaiting()});
    self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});
    self.addEventListener('fetch',e=>{
      if(e.request.method!=='GET')return;
      e.respondWith(
        caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{
          if(resp.ok&&e.request.url.startsWith(self.location.origin)){

            caches.open(CACHE).then(c=>c.put(e.request,clone));
          }
          return resp;
        }).catch(()=>caches.match(e.request)))
      );
    });
  `;

function normalize(x){return x.toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i')}
function applyFilters(arr){
  let items=arr.slice();
  const f=state.filters;
  if(f.vegan)items=items.filter(p=>p.vegan===true);
  if(f.onlyFiber)items=items.filter(p=>(p.n&&p.n.fiber||0)>=5);
  if(f.lowSugar)items=items.filter(p=>(p.n&&p.n.sugar||0)<5);
  if(f.noAllergens)items=items.filter(p=>!p.allergens||p.allergens.length===0);
  if(f.excludeAllergens&&f.excludeAllergens.length)items=items.filter(p=>!(f.excludeAllergens.some(a=>p.allergens.includes(a))));
  return items;
}
function applySort(arr){
  const s=state.sort;
  if(s==='name')return arr.slice().sort((a,b)=>normalize(a.name).localeCompare(normalize(b.name),'tr'));

  if(s==='fiber_desc')return arr.slice().sort((a,b)=>(b.n?.fiber||0)-(a.n?.fiber||0));
  if(s==='kcal_asc')return arr.slice().sort((a,b)=>(a.n?.kcal||0)-(b.n?.kcal||0));
  if(s==='protein_desc')return arr.slice().sort((a,b)=>(b.n?.protein||0)-(a.n?.protein||0));
  return arr;
}

catch(e){if(token!==lookupToken||!document.getElementById('modal').open||document.getElementById('modal-title').textContent!=='Ürün aranıyor')return;modal('Birlikte tamamlayalım',`<div class="empty">${icon('search')}<h3>${e.message==='missing'?'Bu barkod henüz bulunamadı.':'Şu an veriye ulaşamıyoruz.'}</h3><p>${e.message==='missing'?'Ürünün etiketini kendi listene ekleyebilirsin.':'İnternet bağlantını kontrol et. Örnek ürünlerle denemeye devam edebilirsin.'}</p><button class="primary" data-action="add">Ürün ekle</button><button class="link full" data-action="scan">Yeniden dene</button></div>`)}finally{clearTimeout(timer)}}

if(a==='share'){const p=get(id),text=`flib ile etikete baktım: ${p.name}. ${p.live?'Kaynak: Open Food Facts.':'Prototipteki örnek / doğrulanmamış kayıt.'} İçindekiler: ${p.ingredients}`;try{if(navigator.share)await navigator.share({title:'flib · '+p.name,text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);toast('Ürün özeti kopyalandı.')}else modal('Ürün özetini kopyala',`<textarea class="input" readonly>${esc(text)}</textarea>`)}catch(err){if(err.name!=='AbortError')toast('Paylaşım açılamadı.')}}});
document.addEventListener('input',e=>{
  if(e.target.id==='search-input'){query=e.target.value;document.getElementById('results').innerHTML=results()}
  if(e.target.name==='theme'){state.theme=e.target.dataset.theme;applyTheme();save();}
  if(e.target.dataset.pref){const p=e.target.dataset.pref;state.prefs=e.target.checked?[...new Set([...state.prefs,p])]:state.prefs.filter(x=>x!==p);save();toast('Tercihlerin kaydedildi.')}
  if(e.target.dataset.action==='sort'){state.sort=e.target.value;save();render();}
  if(e.target.id==='photo'&&e.target.files[0]){const img=document.getElementById('photo-preview');img.src=URL.createObjectURL(e.target.files[0]);img.classList.remove('hidden')}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='barcode-form'){e.preventDefault();lookup(document.getElementById('barcode').value.trim())}
  if(e.target.id==='add-form'){e.preventDefault();const name=document.getElementById('new-name').value.trim(),ingredients=document.getElementById('new-ingredients').value.trim();
  if(!name||!ingredients)return toast('Ürün adını ve içindekileri doldur.');
  const n={};NUTRI_KEYS.forEach(k=>{const el=document.getElementById('new-'+k);if(el&&el.value)n[k]=parseFloat(el.value);else n[k]=null;});
  const p={id:'local-'+Date.now(),name,brand:document.getElementById('new-brand').value.trim()||'Kişisel ürün',ingredients,allergens:[],vegan:document.getElementById('new-vegan')?.checked?true:false,n:n,portion:100,weight:'',type:'bag',color:'#97ac83',bg:'#edf1e5',label:'flib',sub:'KİŞİSEL KAYIT',cat:'Diğer',custom:true};
  state.custom.push(p);state.favorites.push(p.id);save();render();details(p.id)}
});
document.getElementById('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera()});
window.addEventListener('pagehide',stopCamera);
// Auto theme listener
if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='auto')applyTheme();})}
render();
</script>
</body>
</html>
